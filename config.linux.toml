#:schema https://mise.jdx.dev/schema/mise.json

[bootstrap.user]
login_shell = "/usr/bin/fish"

[bootstrap.hooks]
post-packages = "command -v fc-cache >/dev/null && fc-cache -f ~/.local/share/fonts || true"

[env]
REQUESTS_CA_BUNDLE = "/etc/ssl/certs"

[bootstrap.packages]
"apt:fish" = "latest"
"dnf:fish" = "latest"
