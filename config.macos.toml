#:schema https://mise.jdx.dev/schema/mise.json

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[dotfiles]
"~/Library" = { source = "home/Library/", mode = "symlink-each", manifest = "git" }

[env]
DOCKER_HOST = "unix://{{ env.HOME }}/.config/colima/default/docker.sock"
_.path = ["/opt/homebrew/bin", "/opt/homebrew/sbin"]

[bootstrap.packages]
"brew:fish" = "latest"
"brew-cask:arc" = "latest"
"brew-cask:bettercapture" = "latest"
"brew-cask:deskpad" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:gimp" = "latest"
"brew-cask:heynote" = "latest"
"brew-cask:inkscape" = "latest"
# "brew-cask:karabiner-elements" = "latest" # TODO: report bug in Mise
"brew-cask:mac-mouse-fix" = "latest"
"brew-cask:mitmproxy" = "latest"
"brew-cask:monitorcontrol" = "latest"
"brew-cask:zed" = "latest"

[tools]
"github:docker/docker-credential-helpers" = { version = "latest", matching = "osxkeychain-v", rename_exe = "docker-credential-osxkeychain" }

[bootstrap.macos.launchd.agents.env]
program = "/bin/sh"
args = ["-c", '{{ mise_bin }} env -D | while IFS== read -r k v; do launchctl setenv "$k" "$v"; done']
run_at_load = true
