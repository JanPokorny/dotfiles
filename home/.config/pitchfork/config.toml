# Local model gateway: every agent CLI talks to llama-swap on 127.0.0.1:47900,
# which fronts all upstreams under "<peer>/<model>" ids. See ~/.config/llama-swap/.
[settings.general]
mise = true

# Keys come from 1Password at start, so the CLIs never call op themselves.
# Private peers are age-encrypted in the repo (llama-swap/private.sh).
[daemons.llama-swap]
run = "exec ~/.config/llama-swap/llama-swap.sh"
ready_http = { url = "http://127.0.0.1:47900/health", timeout = "10m" }
retry = true
boot_start = true

# The kube token is short-lived: after a re-login,
# `pitchfork restart dsv41-flash-forward dsv41-flash-tls`.
[daemons.dsv41-flash-forward]
run = "exec ~/.config/llama-swap/dsv41-flash-forward.sh"
ready_port = 47917
retry = true
boot_start = true

# vLLM speaks TLS with a cluster-CA certificate and wants its key as Bearer.
# Go on macOS ignores SSL_CERT_FILE, so llama-swap cannot trust that CA itself:
# this Caddy hop validates it and adds the key.
[daemons.dsv41-flash-tls]
run = "exec ~/.config/llama-swap/dsv41-flash-tls.sh"
ready_port = 47918
retry = true
boot_start = true
