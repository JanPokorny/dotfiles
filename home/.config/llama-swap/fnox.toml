#:schema https://fnox.jdx.dev/schema.json
# Private llama-swap config as age ciphertext; the age key sits in the login keychain (service mise-llama-swap,
# written by fnox so it reads it without a dialog), so daemon restarts never ask 1Password.
# New machine, once (one 1Password approval), then `pitchfork restart llama-swap dsv41-flash-forward dsv41-flash-tls`:
#   op read --account ibm.ent.1password.com 'op://rsjz2rywqgfp4o3wmwks7qizea/fxulkjkopyluicq7ecnz7hc37q/credential' | grep -v '^#' | fnox -c ~/.config/llama-swap/fnox.toml set AGE_IDENTITY
# Edit or rotate in the repo copy (~/.config/mise/home/.config/llama-swap), then commit and copy it to ~/.config/llama-swap:
#   fnox edit
#   op read --account ibm.ent.1password.com op://rsjz2rywqgfp4o3wmwks7qizea/gf5pvk7rveqittwbpwj3sfhccq/credential | fnox -P gateway set ETE_LITELLM_API_KEY -p age
#   op read --account ibm.ent.1password.com op://rsjz2rywqgfp4o3wmwks7qizea/45e5cbsloq3tgenkfaqear4doi/credential | fnox -P gateway set ETE_LITELLM_V2_API_KEY -p age
#   op read --account ibm.ent.1password.com "$(fnox get CB_LITELLM_OP_REF)" | fnox -P gateway set CB_LITELLM_API_KEY -p age
# Keep each value a plain age entry: a `sync` field would shadow later `fnox set`s.
if_missing = "error"
env = "exec"

[providers.keychain]
type = "keychain"
service = "mise-llama-swap"

[providers.age]
type = "age"
recipients = ["age1tt4u6xuchut67sjt4rmmzydz0rynz4tcjwz2ldga0uza7wd7se6q7jwsf0"]
identity = { provider = "keychain", value = "age-identity" }

[secrets]
AGE_IDENTITY= { provider = "keychain", value = "age-identity", env = false }
CB_LITELLM_OP_REF= { provider = "age", value = "", env = false }
DSV41_NAMESPACE= { provider = "age", value = "" }
DSV41_KUBE_CONTEXT= { provider = "age", value = "" }
DSV41_TLS_NAME= { provider = "age", value = "" }
DSV41_SERVICE= { provider = "age", value = "" }

[profiles.gateway.secrets]
PRIVATE_PEERS_YAML= { provider = "age", value = "", as_file = true }
CB_LITELLM_API_KEY= { provider = "age", value = "" }
ETE_LITELLM_API_KEY= { provider = "age", value = "" }
ETE_LITELLM_V2_API_KEY= { provider = "age", value = "" }
