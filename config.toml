#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
python.uv_venv_auto = "create|source"
idiomatic_version_file_enable_tools = []
github.credential_command = "gh auth token"
install_layout = "identity"

[dotfiles]
"~" = { source = "home", mode = "copy" }
"~/.claude/CLAUDE.md" = { source = "etc/AGENTS.md", mode = "copy" }
"~/.pi/agent/AGENTS.md" = { source = "etc/AGENTS.md", mode = "copy" }

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

[tools]
"github:MitMaro/git-interactive-rebase-tool" = "latest"
"github:dlvhdr/gh-dash" = "latest"
"github:docker/buildx" = { version = "latest", rename_exe = "docker-buildx" }
"github:docker/compose" = { version = "latest", rename_exe = "docker-compose" }
1password = "latest"
agent-browser = "latest"
ast-grep = "latest"
bat = "latest"
claude = { version = "latest", minimum_release_age = "0s" }
colima = "latest"
croc = "latest"
dive = "latest"
docker-cli = "latest"
fd = "latest"
gh = "latest"
git-lfs = "latest"
gron = "latest"
helm = "latest"
hexyl = "latest"
htmlq = "latest"
jq = "latest"
kubectl = "latest"
lima = "latest"
lsd = "latest"
node = "26"
oc = "latest"
pi = "latest"
pitchfork = "latest"
ripgrep = "latest"
sd = "latest"
television = "latest"
usage = "latest"
uv = "latest"
yq = "latest"
fnox = { version = "latest", workflow = "release.yml" }

[tasks.bootstrap]
run = """
mkdir -p ~/.docker/cli-plugins
ln -sf ~/.local/share/mise/shims/docker-buildx ~/.docker/cli-plugins/docker-buildx
ln -sf ~/.local/share/mise/shims/docker-compose ~/.docker/cli-plugins/docker-compose

pitchfork boot enable
"""

[env]
XDG_CONFIG_HOME = "{{ env.HOME }}/.config"
NODE_EXTRA_CA_CERTS = "{{ get_env(name='TMPDIR', default='/tmp') }}/dam-llm-service-ca.crt"
npm_config_min_release_age = "7"
npm_config_min_release_age_exclude = "@dam-agents/cli"
YARN_NPM_MINIMAL_AGE_GATE = "10080"
pnpm_config_minimum_release_age = "10080"
UV_EXCLUDE_NEWER = "7 days"
