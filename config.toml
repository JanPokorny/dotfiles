#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
python.uv_venv_auto = "create|source"
idiomatic_version_file_enable_tools = []
github.credential_command = "gh auth token"

[dotfiles]
"~/.config" = { source = "home/.config", mode = "symlink-each", manifest = "git", exclude = ["karabiner"] }
"~/.local/bin" = { source = "home/.local/bin", mode = "symlink-each", manifest = "git" }

[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"

[tools]
"1password" = "latest"
"aqua:vercel-labs/agent-browser" = "latest"
"bat" = "latest"
"claude" = { version = "latest", minimum_release_age = "0s" }
"colima" = "latest"
"croc" = "latest"
"docker-cli" = "latest"
"eza" = "latest"
"fd" = "latest"
"gh" = "latest"
"github:FredrikNoren/ungit" = "latest"
"github:MitMaro/git-interactive-rebase-tool" = "latest"
"github:alexpasmantier/television" = "latest"
"github:docker/buildx" = { version = "latest", rename_exe = "docker-buildx" }
"github:docker/compose" = { version = "latest", rename_exe = "docker-compose" }
"github:wagoodman/dive" = "latest"
"gron" = "latest"
"helm" = "latest"
"hexyl" = "latest"
"htmlq" = "latest"
"jq" = "latest"
"kubectl" = "latest"
"lima" = "latest"
"node" = "26"
"oc" = { version = "latest", bin = "oc", checksum_url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/sha256sum.txt", platforms = { linux-arm64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux-arm64-{{ version }}.tar.gz" }, linux-x64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux-{{ version }}.tar.gz" }, macos-arm64 = { url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-mac-arm64-{{ version }}.tar.gz" } }, version_expr = "sortVersions(versions)", version_list_url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/", version_regex = 'href="(\d+\.\d+\.\d+)/"' }
"pi" = "latest"
"ripgrep" = "latest"
"sd" = "latest"
"usage" = "latest"
"uv" = "latest"
"yq" = "latest"

[tasks.bootstrap]
run = """
mkdir -p ~/.docker/cli-plugins
ln -sf ~/.local/share/mise/shims/docker-buildx ~/.docker/cli-plugins/docker-buildx
ln -sf ~/.local/share/mise/shims/docker-compose ~/.docker/cli-plugins/docker-compose
"""

[env]
XDG_CONFIG_HOME = "{{ env.HOME }}/.config"
CLAUDE_CONFIG_DIR = "{{ env.HOME }}/.config/claude"
npm_config_min_release_age = "7"
YARN_NPM_MINIMAL_AGE_GATE = "10080"
pnpm_config_minimum_release_age = "10080"
UV_EXCLUDE_NEWER = "7 days"
